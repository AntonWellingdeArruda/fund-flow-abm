[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-flow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
app = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve the package from src/ directly — robust against editable-install
# .pth quirks when the project path contains spaces.
pythonpath = ["src"]
# Live tests hit external APIs (BCB/FRED/Yahoo/ANBIMA) and are slow + flaky;
# deselected by default. Run them explicitly with:  pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: test makes real network calls to an external data API",
]
